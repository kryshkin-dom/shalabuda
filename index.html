:root{--ui:#1d1d1b;--ui-bg:#e9e6df;--ui-panel:#f7f5f0;--ui-line:#c9c4b8;--accent:#b3261e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ui-bg);color:var(--ui);font:14px/1.4 "PT Mono",monospace}

/* ---------- интерфейс ---------- */
header.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--ui);color:#f3efe6}
header.bar h1{font:16px "Rubik Mono One";margin:0 12px 0 0;letter-spacing:.02em}
header.bar button,header.bar label.btn{font:13px "PT Mono";background:#f3efe6;color:var(--ui);border:0;padding:6px 10px;cursor:pointer;border-radius:2px}
header.bar button.primary{background:var(--accent);color:#fff}
header.bar .status{margin-left:auto;font-size:12px;opacity:.8}
.layout{display:grid;grid-template-columns:1fr 320px;gap:0;min-height:calc(100vh - 52px)}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static!important;height:auto!important}}
.board{padding:24px 16px 80px;display:flex;flex-direction:column;align-items:center;gap:28px}
.spread{display:flex;gap:2px;zoom:var(--z,.62);box-shadow:0 2px 0 #0002,0 12px 30px #0002}
.spread .page{cursor:pointer}
.spread-label{font-size:12px;opacity:.6;margin-bottom:-18px}
.page.selected{outline:3px solid var(--accent);outline-offset:-3px}
.side{position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto;background:var(--ui-panel);border-left:1px solid var(--ui-line);padding:16px}
.side h2{font:13px "Rubik Mono One";margin:0 0 12px}
.side label{display:block;font-size:12px;margin:12px 0 4px;opacity:.75}
.side input[type=text],.side select,.side textarea{width:100%;font:13px "PT Mono";padding:6px;border:1px solid var(--ui-line);background:#fff}
.side textarea{min-height:150px;resize:vertical;font-family:"PT Serif";font-size:14px}
.side input[type=range]{width:100%}
.side .row{display:flex;gap:6px;flex-wrap:wrap}
.side button{font:12px "PT Mono";padding:6px 8px;border:1px solid var(--ui-line);background:#fff;cursor:pointer}
.side .photo-box{border:1px dashed var(--ui-line);padding:8px;margin-top:10px;background:#fff}
.side .hint{font-size:11px;opacity:.65;margin-top:6px}
.quotes{margin-top:22px;border-top:1px solid var(--ui-line);padding-top:12px}
.quotes .q{background:#fff;border:1px solid var(--ui-line);padding:8px;margin:8px 0;font:13px/1.35 "PT Serif"}
.quotes .q .meta{font:11px "PT Mono";opacity:.7;display:flex;justify-content:space-between;gap:6px;margin-bottom:4px}
.quotes .q .ln{white-space:pre-wrap}
.quotes .q .row{margin-top:6px}
.zoomctl{display:flex;align-items:center;gap:6px;font-size:12px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal .box{background:#fff;max-width:520px;padding:20px;border-radius:2px}
.modal h3{font:15px "Rubik Mono One";margin:0 0 10px}
.modal ol{padding-left:20px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal button{font:13px "PT Mono";padding:7px 12px;border:1px solid #999;background:#fff;cursor:pointer}
.modal button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- полоса зина (A5) ---------- */
.page{width:148mm;height:210mm;background:#fff;color:#000;position:relative;overflow:hidden;flex:none;
  padding:11mm 11mm 14mm;display:flex;flex-direction:column;font-family:"PT Serif",serif}
.page .run{display:flex;justify-content:space-between;font:7.5pt "PT Mono";letter-spacing:.08em;text-transform:uppercase;
  border-bottom:.8pt dashed #000;padding-bottom:1.2mm;margin-bottom:5mm}
.page .folio{position:absolute;bottom:6mm;font:8pt "PT Mono"}
.page.even .folio{left:11mm}.page.odd .folio{right:11mm}
.slot{position:relative;border:1.2pt solid #000;background:#fff;overflow:hidden;flex:1 1 auto;min-height:30mm}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot.empty{border-style:dashed;display:flex;align-items:center;justify-content:center;font:9pt "PT Mono";color:#777;
  background:repeating-linear-gradient(-45deg,#fff 0 3mm,#f1f1f1 3mm 3.4mm)}
.slot.drop{outline:3px solid var(--accent)}
.tape{position:absolute;width:22mm;height:6mm;background:repeating-linear-gradient(90deg,#e8e8e8 0 1mm,#dcdcdc 1mm 2mm);opacity:.9;z-index:3}
.tape.tl{top:-2mm;left:6mm;transform:rotate(-8deg)}.tape.br{bottom:-2mm;right:6mm;transform:rotate(-6deg)}
.frame{position:relative;flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.f-xerox{filter:grayscale(1) contrast(1.75) brightness(1.08)}
.f-bw{filter:grayscale(1) contrast(1.12)}
.f-orig{filter:none}
.cap{white-space:pre-wrap;font-size:10.5pt;line-height:1.38;margin-top:4mm;outline:none;min-height:8mm}
.cap:empty::before{content:"подпись…";color:#aaa}
.cap.typed{font-family:"PT Mono";font-size:9.5pt;background:#fff;border:.8pt solid #000;padding:2.5mm 3mm;transform:rotate(-.6deg);align-self:flex-start;max-width:100%}

/* обложка */
.l-cover{padding:9mm}
.l-cover .mast{font:40pt/0.95 "Rubik Mono One";letter-spacing:-.01em;transform:rotate(-1.5deg);transform-origin:left;margin:1mm 0 3mm}
.l-cover .imprint{font:8.5pt/1.35 "PT Mono";border-top:1.6pt solid #000;border-bottom:.8pt solid #000;padding:1.4mm 0;margin-bottom:4mm;display:flex;justify-content:space-between;gap:4mm}
.l-cover .badge{position:absolute;right:6mm;top:44mm;width:24mm;height:24mm;border:1.4pt solid #000;border-radius:50%;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font:7pt/1.1 "PT Mono";text-align:center;transform:rotate(12deg);z-index:4}
.l-cover .badge b{font:13pt "Rubik Mono One"}
.l-cover .anons{font:8.5pt/1.5 "PT Mono";margin-top:3mm;text-transform:uppercase;letter-spacing:.04em}
.l-cover .cap{font-family:"PT Mono";font-size:8.5pt;margin-top:2mm}

/* титульный / поздравление */
.l-title .big{font:21pt/1.05 "Rubik Mono One";margin:2mm 0 5mm}
.l-title .cap{font-size:10.5pt;line-height:1.45;margin-top:0}
.l-title .frame{flex:0 0 38mm;margin-top:auto}

/* глава */
.l-chapter .num{font:44pt/1 "Rubik Mono One";margin:0}
.l-chapter .ttl{font:14pt/1.1 "Rubik Mono One";margin:1mm 0 5mm;text-transform:uppercase}

/* только текст */
.l-text .cap{font-size:12pt;line-height:1.5;margin:auto 0}

/* две фотографии */
.l-photo2 .frames{display:flex;flex-direction:column;gap:5mm;flex:1 1 auto;min-height:0}
.l-photo2 .frame:nth-child(2){transform:rotate(1.2deg)}

/* задняя обложка */
.l-back{padding:12mm}
.l-back .hey{font:26pt/1 "Rubik Mono One";transform:rotate(-2deg);margin:6mm 0 auto}
.l-back .colophon{font:8pt/1.5 "PT Mono";border-top:1.2pt solid #000;padding-top:3mm;display:flex;gap:5mm;align-items:flex-end}
.l-back .qr{width:30mm;height:30mm;flex:none}
.l-back .qr svg{width:100%;height:100%}
.l-back .cap{font-family:"PT Mono";font-size:8.5pt}
/* Цветное фото задней обложки — без изменения других страниц */
.l-back .hey{margin:3mm 0 5mm}
.l-back .frame{flex:1 1 auto;min-height:0;margin-bottom:5mm}
.l-back .colophon{flex:none}
.l-back .slot img{filter:none!important}

/* ---------- печать ---------- */

"Чувак взял паяльник и не промахнулся.\n— Ебать, развлекуха.\n— Добро пожаловать в клуб. Мир корчей встречает тебя торжеством."},
    {layout:"back", kicker:"", photos:[{src:BACK_PHOTO,x:50,y:50,z:1,f:"orig",b:1}], caption:

/* ---------- состояние и хранение ---------- */
let state = null, sel = 0, pickTarget = null;
const DB = {name:"shalabuda-zine", store:"kv"};
function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open(DB.name,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(DB.store); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e)} }); }
async function dbGet(k){ try{ const d=await idb(); return await new Promise((res)=>{ const q=d.transaction(DB.store).objectStore(DB.store).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(null);}); }catch(e){ return null; } }
async function dbSet(k,v){ try{ const d=await idb(); await new Promise((res,rej)=>{ const t=d.transaction(DB.store,"readwrite"); t.objectStore(DB.store).put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error);}); return true; }catch(e){ return false; } }
let saveTimer=null;
function changed(rerender=true){ if(rerender) renderBoard(); setStatus("…"); clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{ const ok=await dbSet("state",state); setStatus(ok?"сохранено в браузере "+new Date().toLocaleTimeString().slice(0,5):"не сохранилось в браузере — сохраните проект в файл"); },500); }
function setStatus(t){ document.getElementById("status").textContent=t; }

/* ---------- рендер полосы ---------- */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function slotHTML(p,i,pi,interactive){
  const s=p.photos[i]; if(!s||!s.src) return `<div class="frame"><div class="slot empty" data-slot="${pi}:${i}">${interactive?"＋ фото: клик или перетащить":""}</div></div>`;
  const tilt=((pi*7+i*3)%5-2)*0.45;
  return `<div class="frame" style="transform:rotate(${tilt}deg)"><div class="slot" data-slot="${pi}:${i}">
    <img src="${s.src}" style="filter:${pi===15?"none":filt(s)};object-position:${s.x}% ${s.y}%;transform:scale(${s.z});transform-origin:${s.x}% ${s.y}%" alt="">
    </div><span class="tape tl"></span>${i%2?'':'<span class="tape br"></span>'}</div>`;
}
function capHTML(p,pi,interactive,cls=""){
  return `<div class="cap ${cls}" data-cap="${pi}" ${interactive?'contenteditable="plaintext-only" spellcheck="false"':''}>${esc(p.caption)}</div>`;
}
function editableStatic(key, defaultText, interactive) {
  if (!state.fields) state.fields = {};
  const val = Object.prototype.hasOwnProperty.call(state.fields, key) ? state.fields[key] : defaultText;
  return `${interactive ? `contenteditable="plaintext-only" data-static="${key}" spellcheck="false"` : ""}>${esc(val)}`;
}

function pageHTML(pi,interactive){
  const p=state.pages[pi], n=pi+1, side=(n%2?"odd":"even");
  const run=`<div class="run"><span ${editableStatic("run-title", "Шалабуда № 128", interactive)}</span><span ${interactive?`contenteditable="plaintext-only" data-field="kicker:${pi}"`:""}>${esc(p.kicker||"")}</span></div>`;
  const folio=`<div class="folio" ${editableStatic(`folio-${pi}`, String(n), interactive)}</div>`;
  let inner="";
  switch(p.layout){
    case "cover":
      inner=`<div class="mast" ${editableStatic("cover-mast", "ШАЛАБУДА", interactive)}</div>
        <div class="imprint"><span ${editableStatic("cover-imprint1", "Крышкин дом · отделение «Стрелка»", interactive)}</span><span ${editableStatic("cover-imprint2", "№ 128 / 2026 · тираж 1 экз.", interactive)}</span></div>
        <div class="badge"><span ${editableStatic("cover-badge1", "юбилейный", interactive)}</span><b ${editableStatic("cover-badge2", "30", interactive)}</b><span ${editableStatic("cover-badge3", "выпуск", interactive)}</span></div>
        ${slotHTML(p,0,pi,interactive)}
        ${capHTML(p,pi,interactive)}
        <div class="anons" ${editableStatic("cover-anons", "В номере: клуб полуночников · корчи и окна · мир корчей", interactive)}</div>`;
      return `<div class="page l-cover ${side}" data-page="${pi}">${inner}</div>`;
    case "title":
      inner=`${run}<div class="big" ${interactive?`contenteditable="plaintext-only" data-field="big:${pi}"`:""} style="white-space:pre-line">${esc(p.big??"С 30-летием,\nчувак!")}</div>${capHTML(p,pi,interactive)}${p.photos[0]&&p.photos[0].src||interactive?slotHTML(p,0,pi,interactive):""}${folio}`; break;
    case "chapter":
      inner=`${run}<div class="num" ${interactive?`contenteditable="plaintext-only" data-field="num:${pi}"`:""}>${esc(p.num||"")}</div>
        <div class="ttl" ${interactive?`contenteditable="plaintext-only" data-field="ttl:${pi}"`:""}>${esc(p.ttl||"")}</div>
        ${slotHTML(p,0,pi,interactive)}${capHTML(p,pi,interactive)}${folio}`; break;
    case "photo":
      inner=`${run}${slotHTML(p,0,pi,interactive)}${capHTML(p,pi,interactive)}${folio}`; break;
    case "photo2":
      while(p.photos.length<2) p.photos.push(ph(1)[0]);
      inner=`${run}<div class="frames">${slotHTML(p,0,pi,interactive)}${slotHTML(p,1,pi,interactive)}</div>${capHTML(p,pi,interactive)}${folio}`; break;
    case "text":
      inner=`${run}${capHTML(p,pi,interactive)}${folio}`; break;
    case "back":
      inner=`<div class="hey" ${editableStatic("back-hey", "Хей-лалалей.", interactive)}</div>
        ${slotHTML(p,0,pi,interactive)}
        <div class="colophon"><div class="qr">${QR_SVG}</div><div>${capHTML(p,pi,interactive)}<div style="margin-top:2mm" ${editableStatic("back-site", SITE, interactive)}</div></div></div>`;
      return `<div class="page l-back ${side}" data-page="${pi}">${inner}</div>`;
  }
  return `<div class="page l-${p.layout} ${side}" data-page="${pi}">${inner}</div>`;
}

/* ---------- доска ---------- */
function spreads(){ const s=[[0]]; for(let i=1;i<15;i+=2) s.push([i,i+1]); s.push([15]); return s; }
function renderBoard(){
  const b=document.getElementById("board");
  b.innerHTML=spreads().map(sp=>`<div class="spread-label">${sp.map(i=>"стр. "+(i+1)).join(" · ")}</div>
    <div class="spread">${sp.map(i=>pageHTML(i,true)).join("")}</div>`).join("");
  b.querySelectorAll(".page").forEach(el=>{ if(+el.dataset.page===sel) el.classList.add("selected"); });
  applyZoom();
}
function applyZoom(){ document.querySelectorAll(".spread").forEach(s=>s.style.setProperty("--z",document.getElementById("zoom").value)); }

/* ---------- боковая панель ---------- */
function renderSide(){
  const p=state.pages[sel], side=document.getElementById("side");
  const fixed=(sel===0||sel===15);
  const opts=Object.entries(LAYOUTS).filter(([k])=>fixed?k===p.layout:!["cover","back"].includes(k))
    .map(([k,v])=>`<option value="${k}" ${k===p.layout?"selected":""}>${v.name}</option>`).join("");
  const slots=LAYOUTS[p.layout].slots;
  let photos="";
  for(let i=0;i<slots;i++){ const s=p.photos[i]||{};
    photos+=`<div class="photo-box"><div class="row"><b style="font-size:12px">Фото ${slots>1?i+1:""}</b></div>
      <div class="row" style="margin-top:6px"><button data-act="pick" data-i="${i}">${s.src?"Заменить":"Вставить фото"}</button>${s.src?`<button data-act="clear" data-i="${i}">Убрать</button>`:""}</div>
      ${s.src?`<label>Обработка</label><select data-k="f" data-i="${i}">
        <option value="xerox" ${s.f==="xerox"?"selected":""}>Ксерокопия (контраст)</option>
        <option value="bw" ${s.f==="bw"?"selected":""}>Чёрно-белое</option>
        <option value="orig" ${s.f==="orig"?"selected":""}>Как есть</option></select>
      <label>Яркость (ночные фото — правее)</label><input type="range" min="0.6" max="2.2" step="0.02" value="${s.b??1}" data-k="b" data-i="${i}">
      <label>Масштаб</label><input type="range" min="1" max="3" step="0.02" value="${s.z}" data-k="z" data-i="${i}">
      <label>Сдвиг по горизонтали</label><input type="range" min="0" max="100" value="${s.x}" data-k="x" data-i="${i}">
      <label>Сдвиг по вертикали</label><input type="range" min="0" max="100" value="${s.y}" data-k="y" data-i="${i}">`:""}
    </div>`; }
  side.innerHTML=`<h2>Страница ${sel+1}</h2>
    <label>Макет</label><select id="layoutSel" ${fixed?"disabled":""}>${opts}</select>
    ${p.layout!=="cover"&&p.layout!=="back"?`<label>Рубрика (вверху справа)</label><input type="text" id="kicker" value="${esc(p.kicker||"")}">`:""}
    ${p.layout==="title"?`<label>Заголовок</label><textarea id="big" style="min-height:50px;font-family:'PT Mono'">${esc(p.big??"")}</textarea>`:""}
    ${p.layout==="chapter"?`<label>Номер главы</label><input type="text" id="num" value="${esc(p.num||"")}"><label>Название главы</label><input type="text" id="ttl" value="${esc(p.ttl||"")}">`:""}
    <label>Подпись / текст</label><textarea id="caption">${esc(p.caption)}</textarea>
    <div class="hint">Текст можно править и прямо на странице. Пустая строка — новый абзац.</div>
    ${photos}
    <div class="hint" style="margin-top:14px">Фото можно перетащить с компьютера прямо на рамку. Фото хранятся только в этом браузере и в файле проекта — никуда не загружаются. HEIC браузер не открывает — сохраните как JPG.</div>
    <div class="row" style="margin-top:16px"><button data-act="prev">← стр.</button><button data-act="next">стр. →</button></div>
    <div class="row" style="margin-top:24px"><button data-act="reset" style="color:#b3261e">Сбросить всё к черновику</button></div>
    ${quotesHTML()}`;
}
function select(i){ sel=Math.max(0,Math.min(15,i)); renderBoard(); renderSide(); }

/* ---------- банк цитат ---------- */
function sceneText(sc,withDate){
  const lines=sc.lines.map(l=>{ let t=l.replace(/^(К|И)( \([^)]*\))?:\s*/,"").trim();
    if(/^\[.*\]$/.test(t)) return null;
    t=t.replace(/»\s*\([^)]*\)$/,"»").replace(/^\[[^\]]*\]\s*/,"").replace(/^«|»$/g,"").replace(/» «/g," ").replace(/\s\/\s/g,(m,o,str)=>/[.!?…)]$/.test(str.slice(0,o))?" ":". ");
    return "— "+t; }).filter(Boolean);
  return (withDate?sc.date+"\n":"")+lines.join("\n");
}
function quotesHTML(){
  const chs=[...new Set(SCENES.map(s=>s.ch))];
  const q=qFilter.q.toLowerCase();
  const list=SCENES.map((s,i)=>({s,i})).filter(({s})=>(!qFilter.ch||s.ch===qFilter.ch)&&(!qFilter.star||s.star)&&(!q||(s.title+" "+s.lines.join(" ")+" "+s.date).toLowerCase().includes(q)));
  return `<div class="quotes"><h2>Цитаты из переписки</h2>
    <select id="qCh"><option value="">все главы (${SCENES.length})</option>${chs.map(c=>`<option ${c===qFilter.ch?"selected":""}>${esc(c)}</option>`).join("")}</select>
    <input type="text" id="qSearch" placeholder="поиск: портал, паяльник, 2019…" value="${esc(qFilter.q)}" style="margin-top:6px">
    <div class="row" style="margin-top:6px;font-size:12px"><label style="margin:0;opacity:1"><input type="checkbox" id="qStar" ${qFilter.star?"checked":""}> только ★</label>
    <label style="margin:0 0 0 10px;opacity:1"><input type="checkbox" id="qDate" ${qFilter.date?"checked":""}> вставлять с датой</label></div>
    <div class="hint">${list.length} шт. «Заменить» — подпись станет этой цитатой, «Добавить» — допишется в конец.</div>
    ${list.map(({s,i})=>`<div class="q"><div class="meta"><span>${s.date}${s.star?" ★":""}</span><span>${esc(s.title)}</span></div>
      <div class="ln">${esc(s.lines.join("\n"))}</div>
      <div class="row"><button data-act="q-set" data-q="${i}">Заменить</button><button data-act="q-add" data-q="${i}">Добавить</button></div></div>`).join("")}
  </div>`;
}

/* ---------- фото ---------- */
function loadImage(file){ return new Promise((res,rej)=>{
  if(!file||!file.type.startsWith("image/")) return rej(new Error("Это не изображение"));
  const fr=new FileReader(); fr.onerror=()=>rej(fr.error);
  fr.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error("Браузер не смог открыть файл (HEIC?)"));
    im.onload=()=>{ const M=2000, k=Math.min(1,M/Math.max(im.width,im.height));
      const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",0.88)); /* перекодирование снимает EXIF/GPS */ };
    im.src=fr.result; };
  fr.readAsDataURL(file); }); }
async function setPhoto(pi,i,file){
  try{ const src=await loadImage(file); const p=state.pages[pi];
    while(p.photos.length<=i) p.photos.push(ph(1)[0]);
    p.photos[i]={src,x:50,y:50,z:1,f:p.photos[i]?.f||"bw",b:1}; sel=pi; changed(); renderSide();
  }catch(e){ alert(e.message); } }

/* ---------- печать ---------- */
const BOOKLET=[[16,1],[2,15],[14,3],[4,13],[12,5],[6,11],[10,7],[8,9]];
let printMode="booklet";
function openPrint(mode){
  printMode=mode;
  const empty=state.pages.reduce((a,p,i)=>a+p.photos.slice(0,LAYOUTS[p.layout].slots).filter(s=>!s||!s.src).length,0);
  document.getElementById("pmTitle").textContent= mode==="booklet"?"Печать книжечки (4 листа A4)":"PDF: 16 страниц A5";
  document.getElementById("pmBody").innerHTML=(empty?`<p style="color:#b3261e">Пустых рамок для фото: ${empty}. В печати они будут пустым местом.</p>`:"")+
   (mode==="booklet"?`<ol><li>Принтер: <b>A4, альбомная</b>, масштаб <b>100 % / «фактический размер»</b>, поля — <b>нет</b>.</li>
     <li>Двусторонняя печать, <b>переворот по короткому краю</b>.</li><li>Включить «Фоновая графика».</li>
     <li>Сложить 4 листа стопкой пополам: страницы пойдут 1…16. Скрепить по сгибу.</li>
     <li>Нужен PDF для Харькова — в принтере выбрать «Сохранить как PDF».</li></ol>
     <label style="font-size:13px"><input type="checkbox" id="grayChk" checked> фото «как есть» тоже печатать в ч/б</label>`
   :`<ol><li>Принтер: «Сохранить как PDF», поля — <b>нет</b>, масштаб 100 %.</li><li>Включить «Фоновая графика».</li><li>Это версия для просмотра на экране / отправки в электронном виде.</li></ol>`);
  document.getElementById("printModal").classList.add("open");
}
function doPrint(){
  const root=document.getElementById("printroot");
  const gray=document.getElementById("grayChk"); printGray=!!(gray&&gray.checked);
  if(printMode==="booklet"){
    document.getElementById("pagesize").textContent="@page{size:297mm 210mm;margin:0}";
    root.innerHTML=BOOKLET.map(([l,r])=>`<div class="sheet">${pageHTML(l-1,false)}${pageHTML(r-1,false)}</div>`).join("");
  }else{
    document.getElementById("pagesize").textContent="@page{size:148mm 210mm;margin:0}";
    root.innerHTML=state.pages.map((_,i)=>`<div class="a5wrap">${pageHTML(i,false)}</div>`).join("");
  }
  document.getElementById("printModal").classList.remove("open");
  printGray=false;
  setTimeout(()=>window.print(),150);
}

/* ---------- события ---------- */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]"); const pg=e.target.closest(".board .page");
  if(a){ const act=a.dataset.act, i=+a.dataset.i;
    if(act==="pick"){ pickTarget=[sel,i]; document.getElementById("photoFile").click(); }
    else if(act==="clear"){ state.pages[sel].photos[i]={...ph(1)[0]}; changed(); renderSide(); }
    else if(act==="prev") select(sel-1); else if(act==="next") select(sel+1);
    else if(act==="reset"){ if(confirm("Сбросить все тексты и фото к исходному черновику?")){ state=defaults(); sel=0; changed(); renderSide(); } }
    else if(act==="print-booklet") openPrint("booklet"); else if(act==="print-a5") openPrint("a5");
    else if(act==="close-modal") document.getElementById("printModal").classList.remove("open");
    else if(act==="do-print") doPrint();
    else if(act==="export") exportProject();
    else if(act==="q-set"||act==="q-add"){ const sc=SCENES[+a.dataset.q], txt=sceneText(sc,qFilter.date), p=state.pages[sel];
      if(p.layout==="cover"||p.layout==="back"){ alert("Выберите страницу 2–15"); return; }
      p.caption= act==="q-set"?txt:(p.caption?p.caption+"\n\n":"")+txt; changed(); const sy=document.getElementById("side").scrollTop; renderSide(); document.getElementById("side").scrollTop=sy; }
    return; }
  if(pg){ const pi=+pg.dataset.page; const slot=e.target.closest(".slot");
    if(slot&&slot.classList.contains("empty")){ pickTarget=slot.dataset.slot.split(":").map(Number); sel=pi; document.getElementById("photoFile").click(); return; }
    if(pi!==sel) select(pi); }
});
document.getElementById("photoFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(f&&pickTarget) setPhoto(pickTarget[0],pickTarget[1],f); e.target.value=""; });
document.addEventListener("input",e=>{
  const t=e.target, p=state.pages[sel];
  if(t.matches(".board [data-static]")){ if(!state.fields) state.fields={}; state.fields[t.dataset.static]=t.innerText.replace(/\n$/,""); changed(false); return; }
  if(t.matches(".board .cap")){ state.pages[+t.dataset.cap].caption=t.innerText.replace(/\n$/,""); if(+t.dataset.cap===sel) document.getElementById("caption").value=state.pages[sel].caption; changed(false); return; }
  if(t.matches(".board [data-field]")){ const [k,pi]=t.dataset.field.split(":"); state.pages[+pi][k]=t.innerText.replace(/\n$/,""); changed(false); return; }
  if(t.id==="caption"){ p.caption=t.value; changed(); return; }
  if(t.id==="kicker"){ p.kicker=t.value; changed(); return; }
  if(t.id==="big"){ p.big=t.value; changed(); return; }
  if(t.id==="num"){ p.num=t.value; changed(); return; }
  if(t.id==="ttl"){ p.ttl=t.value; changed(); return; }
  if(t.dataset.k){ const s=p.photos[+t.dataset.i]; s[t.dataset.k]=t.dataset.k==="f"?t.value:+t.value; changed(); return; }
  if(t.id==="qSearch"){ qFilter.q=t.value; const pos=t.selectionStart; renderSide(); const n=document.getElementById("qSearch"); n.focus(); n.setSelectionRange(pos,pos); return; }
  if(t.id==="zoom"){ applyZoom(); try{localStorage.setItem("zine-zoom",t.value)}catch(_){} }
});
document.addEventListener("change",e=>{
  if(e.target.id==="qCh"){ qFilter.ch=e.target.value; renderSide(); return; }
  if(e.target.id==="qStar"){ qFilter.star=e.target.checked; renderSide(); return; }
  if(e.target.id==="qDate"){ qFilter.date=e.target.checked; return; }
  if(e.target.id==="layoutSel"){ const p=state.pages[sel]; p.layout=e.target.value;
  const need=LAYOUTS[p.layout].slots; while(p.photos.length<need) p.photos.push(ph(1)[0]);
  if(p.layout==="chapter"){ p.num=p.num||"?"; p.ttl=p.ttl||"Название"; } changed(); renderSide(); }});
document.addEventListener("focusout",e=>{ if(e.target.matches(".board .cap,.board [data-field]")) renderSide(); });
/* drag & drop */
document.addEventListener("dragover",e=>{ const s=e.target.closest(".board .slot"); if(s){ e.preventDefault(); s.classList.add("drop"); } });
document.addEventListener("dragleave",e=>{ const s=e.target.closest(".board .slot"); if(s) s.classList.remove("drop"); });
document.addEventListener("drop",e=>{ const s=e.target.closest(".board .slot"); if(!s) return; e.preventDefault();
  const [pi,i]=s.dataset.slot.split(":").map(Number); const f=e.dataTransfer.files[0]; if(f) setPhoto(pi,i,f); });

/* ---------- проект в файл ---------- */
function exportProject(){
  const blob=new Blob([JSON.stringify(state)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="shalabuda-zine-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
document.getElementById("importFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader(); fr.onload=()=>{ try{ const s=JSON.parse(fr.result); if(!s.pages||s.pages.length!==16) throw new Error("не тот файл");
    state=s; sel=0; changed(); renderSide(); }catch(err){ alert("Не удалось открыть проект: "+err.message); } }; fr.readAsText(f); e.target.value=""; });

/* ---------- режим чтения (сайт) ---------- */
function readerRender(){
  const w=document.documentElement.clientWidth, pageW=148*96/25.4;
  const wide=w>=pageW*2*0.6+40;
  const groups=wide?spreads():state.pages.map((_,i)=>[i]);
  const z=Math.min(1.2,(w-24)/((wide?2:1)*pageW+(wide?2:0)));
  document.getElementById("board").innerHTML=groups.map(sp=>`<div class="spread" style="--z:${z.toFixed(3)}">${sp.map(i=>pageHTML(i,false)).join("")}</div>`).join("");
}
(async()=>{
  const C=window.SHALABUDA||{zinePublic:true};
  async function show(s){ state=s; sel=-1; readerRender(); let t; addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(readerRender,150);}); }
  if(C.zinePublic){ await show(await (await fetch("zine/state.json")).json()); return; }
  document.getElementById("lock").classList.remove("hidden"); document.getElementById("rpdf").classList.add("hidden");
  gate(async m=>{ await show(JSON.parse(new TextDecoder().decode(await Vault.read(m.zine.state.blob))));
    const a=document.getElementById("rpdf"); a.classList.remove("hidden"); a.onclick=e=>{e.preventDefault();Vault.download(m.zine.pdf);}; });
})();
</script>
